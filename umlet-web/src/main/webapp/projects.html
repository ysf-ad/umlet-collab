<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects – UMLetino Collab</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script>
        // old links (?room=...) went to the editor directly
        if (new URLSearchParams(location.search).has('room')) location.replace('app.html' + location.search);
    </script>
    <style>
        :root {
            --bg: #f6f7f9; --card: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
            --accent: #2563eb; --accent-fg: #ffffff; --danger: #cf222e; --hover: #eef1f5;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #111317; --card: #1b1d21; --fg: #e6e6e6; --muted: #9aa0a6; --border: #33363c; --accent: #6ea8fe; --accent-fg: #0b1220; --danger: #ff7b72; --hover: #24272d; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
        header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        header img { width: 36px; height: 36px; }
        h1 { font-size: 22px; margin: 0; }
        header p { margin: 0; color: var(--muted); font-size: 14px; }
        form { display: flex; gap: 8px; margin-bottom: 24px; }
        input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        button.primary { font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); cursor: pointer; white-space: nowrap; }
        .toolbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
        ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
        li { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border); }
        li:first-child { border-top: 0; }
        li a { flex: 1; min-width: 0; display: block; padding: 12px 16px; color: inherit; text-decoration: none; }
        li a:hover { background: var(--hover); }
        .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .meta { color: var(--muted); font-size: 13px; }
        li button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; margin-right: 12px; cursor: pointer; }
        li button:hover { color: var(--danger); border-color: var(--border); }
        .empty, .error { padding: 32px 16px; text-align: center; color: var(--muted); }
        .error { color: var(--danger); }
    </style>
</head>
<body>
<main>
    <header>
        <img src="UMLetino_logo_small.png" alt="">
        <div>
            <h1>UMLetino Collab</h1>
            <p>Projects are shared with everyone who has the link. Each project holds several UML diagrams.</p>
        </div>
    </header>

    <form id="create">
        <input id="name" placeholder="New project name, e.g. Payment service" maxlength="80" aria-label="Project name">
        <button class="primary" type="submit">Create project</button>
    </form>

    <div class="toolbar"><span id="count"></span><span>Sorted by last edit</span></div>
    <ul id="projects"><li class="empty">Loading…</li></ul>
</main>
<script>
    var list = document.getElementById('projects');
    var count = document.getElementById('count');

    function ago(time) {
        var s = Math.round((Date.now() - time) / 1000);
        if (s < 60) return 'just now';
        var units = [[60, 'minute'], [24, 'hour'], [7, 'day'], [4.35, 'week'], [12, 'month'], [Infinity, 'year']];
        var value = s / 60, i = 0;
        while (value >= units[i][0]) { value /= units[i][0]; i++; }
        var n = Math.floor(value);
        return n + ' ' + units[i][1] + (n === 1 ? '' : 's') + ' ago';
    }

    function render(projects) {
        list.innerHTML = '';
        count.textContent = projects.length + (projects.length === 1 ? ' project' : ' projects');
        if (!projects.length) {
            list.innerHTML = '<li class="empty">No projects yet. Create the first one above.</li>';
            return;
        }
        projects.forEach(function (p) {
            var li = document.createElement('li');
            var a = document.createElement('a');
            a.href = 'app.html?project=' + encodeURIComponent(p.id);
            var name = document.createElement('div');
            name.className = 'name';
            name.textContent = p.name;
            var meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = p.diagrams + (p.diagrams === 1 ? ' diagram' : ' diagrams') + ' · edited ' + ago(p.updatedAt);
            a.appendChild(name);
            a.appendChild(meta);
            var del = document.createElement('button');
            del.textContent = 'Delete';
            del.setAttribute('aria-label', 'Delete project ' + p.name);
            del.addEventListener('click', function () {
                if (!confirm('Delete the project "' + p.name + '" for everyone?')) return;
                fetch('api/projects/' + encodeURIComponent(p.id), { method: 'DELETE' }).then(load);
            });
            li.appendChild(a);
            li.appendChild(del);
            list.appendChild(li);
        });
    }

    function load() {
        fetch('api/projects', { cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(render)
            .catch(function () { list.innerHTML = '<li class="error">Couldn’t load projects. Try reloading the page.</li>'; });
    }

    document.getElementById('create').addEventListener('submit', function (e) {
        e.preventDefault();
        var button = this.querySelector('button');
        button.disabled = true;
        fetch('api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('name').value }) })
            .then(function (r) { return r.json(); })
            .then(function (p) { location.href = 'app.html?project=' + encodeURIComponent(p.id) + '&diagram=' + encodeURIComponent(p.diagrams[0].id); })
            .catch(function () { button.disabled = false; alert('Couldn’t create the project. Try again.'); });
    });

    load();
    window.addEventListener('focus', load);
</script>
</body>
</html>
